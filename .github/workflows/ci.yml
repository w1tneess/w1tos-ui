name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No hard-coded colours outside the generated palette
        run: |
          ! grep -rnoiE '#[0-9a-f]{3,8}\b|hsla?\(|rgba?\(' src --include='*.vue' --include='*.scss' \
            | grep -v '_variables.scss\|generated'
      - run: pnpm test
      - run: pnpm build
      - name: No build-machine environment in the bundle
        run: |
          ! grep -rlE '"(PATH|HOME|USER|GITHUB_TOKEN)":"' build --include='*.js'
      - name: Vue ships in production mode
        run: |
          ! grep -rl 'running Vue in development mode' build --include='*.js'
